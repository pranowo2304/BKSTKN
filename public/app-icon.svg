<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Vibrant Emerald Leaf & Shield Gradient -->
    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Gentle Caring Hands Gradient -->
    <linearGradient id="handLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="handRightGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Heart Glowing Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Solace Light Drop Shadow -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.45" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. SQUIRCLE APP ICON BASE (iOS & Android Style) -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#ambientGlow)" />

  <!-- Outer Rim Stroke Highlight -->
  <rect x="17" y="17" width="478" height="478" rx="111" ry="111" fill="none" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.3" />
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- 2. PROTECTIVE EMBLEM BACKGROUND RING -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.35" />
    <circle cx="256" cy="256" r="148" fill="#042f2e" fill-opacity="0.6" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" />
  </g>

  <!-- 3. LAUREL OF SOLIDARITY / LEAF OF SOLACE (Gotong Royong & Damai) -->
  <!-- Left Laurel Wreath -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <path d="M 170 330 C 160 310 150 280 152 245 C 153 235 142 238 140 248 C 137 285 148 320 162 342 Z" />
    <ellipse cx="145" cy="225" rx="8" ry="16" transform="rotate(-30 145 225)" />
    <ellipse cx="152" cy="190" rx="7" ry="15" transform="rotate(-15 152 190)" />
    <ellipse cx="170" cy="160" rx="7" ry="14" transform="rotate(5 170 160)" />
    <ellipse cx="196" cy="138" rx="6" ry="13" transform="rotate(25 196 138)" />
    <!-- Right Laurel Wreath -->
    <path d="M 342 330 C 352 310 362 280 360 245 C 359 235 370 238 372 248 C 375 285 364 320 350 342 Z" />
    <ellipse cx="367" cy="225" rx="8" ry="16" transform="rotate(30 367 225)" />
    <ellipse cx="360" cy="190" rx="7" ry="15" transform="rotate(15 360 190)" />
    <ellipse cx="342" cy="160" rx="7" ry="14" transform="rotate(-5 342 160)" />
    <ellipse cx="316" cy="138" rx="6" ry="13" transform="rotate(-25 316 138)" />
  </g>

  <!-- 4. PROTECTIVE SHIELD OF BENEVOLENCE (Tameng Perlindungan Kas Warga) -->
  <path d="M 256 120 
           C 295 145 330 150 350 155
           C 350 240 330 310 256 365
           C 182 310 162 240 162 155
           C 182 150 217 145 256 120 Z" 
        fill="url(#emeraldShield)" 
        fill-opacity="0.18" 
        stroke="url(#emeraldShield)" 
        stroke-width="3" 
        stroke-opacity="0.6" />

  <!-- 5. GOTONG ROYONG HANDS (Tangan Merangkul & Melindungi) -->
  <!-- Left Hand cradling upwards -->
  <g filter="url(#dropGlow)">
    <path d="M 165 305
             C 175 285 198 275 220 288
             C 235 297 248 312 256 325
             C 246 332 232 338 215 338
             C 192 338 172 324 165 305 Z"
          fill="url(#handLeftGrad)" />

    <path d="M 180 320
             C 192 342 222 360 256 370
             C 245 375 230 376 215 372
             C 185 364 168 340 162 315
             C 165 315 174 316 180 320 Z"
          fill="#059669" />

    <!-- Right Hand cradling upwards -->
    <path d="M 347 305
             C 337 285 314 275 292 288
             C 277 297 264 312 256 325
             C 266 332 280 338 297 338
             C 320 338 340 324 347 305 Z"
          fill="url(#handRightGrad)" />

    <path d="M 332 320
             C 320 342 290 360 256 370
             C 267 375 282 376 297 372
             C 327 364 344 340 350 315
             C 347 315 338 316 332 320 Z"
          fill="#047857" />
  </g>

  <!-- 6. GLOWING HEART EMBLEM OF SOLACE & CARE (Santunan & Rasa Belasungkawa) -->
  <g filter="url(#dropGlow)">
    <!-- Ambient Heart Glow behind -->
    <path d="M 256 288
             C 256 288 195 242 195 198
             C 195 172 215 152 240 152
             C 247 152 253 154 256 158
             C 259 154 265 152 272 152
             C 297 152 317 172 317 198
             C 317 242 256 288 256 288 Z"
          fill="#10b981" 
          opacity="0.3"
          transform="scale(1.12) translate(-27.4, -20)" />

    <!-- Main Heart Shape -->
    <path d="M 256 285
             C 256 285 200 242 200 200
             C 200 176 218 158 241 158
             C 247 158 252 160 256 164
             C 260 160 265 158 271 158
             C 294 158 312 176 312 200
             C 312 242 256 285 256 285 Z"
          fill="url(#heartGrad)" />

    <!-- Heart Specular Highlight -->
    <path d="M 215 186
             C 215 174 225 166 236 166
             C 240 166 243 167 245 169
             C 241 173 234 182 233 192
             C 223 192 215 190 215 186 Z"
          fill="#ffffff"
          opacity="0.55" />
  </g>

  <!-- 7. GOLDEN STAR / LIGHT SPARKLE OF ETERNAL HOPE (Cahaya Abadi) -->
  <g fill="url(#goldGrad)" filter="url(#softShadow)">
    <!-- Top central sparkle -->
    <path d="M 256 100 Q 256 112 268 112 Q 256 112 256 124 Q 256 112 244 112 Q 256 112 256 100 Z" />
    <circle cx="256" cy="112" r="2.5" fill="#ffffff" />

    <!-- Subtle side glints -->
    <circle cx="178" cy="270" r="3" fill="#fef08a" opacity="0.8" />
    <circle cx="334" cy="270" r="3" fill="#fef08a" opacity="0.8" />
  </g>

  <!-- 8. INNER GOLD BANNER ACCENT -->
  <g filter="url(#softShadow)">
    <path d="M 210 405 
             L 302 405 
             L 292 419 
             L 220 419 Z" 
          fill="url(#goldGrad)" 
          opacity="0.9" />
    <circle cx="256" cy="412" r="2.5" fill="#022c22" />
  </g>
</svg>
